name: Build

on:
  push:
    branches: [ 'main', 'master' ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os: ['windows-latest', 'ubuntu-latest']

    runs-on: ${{matrix.os}}

    steps:
    - uses: actions/checkout@v4
    
    - name: Cache packages
      if: matrix.os == 'windows-latest'
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: |
          ${{ env:VCPKG_INSTALLATION_ROOT }}\downloads
          ${{ env:VCPKG_INSTALLATION_ROOT }}\installed
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-
        save-always: true

    - name: Install Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get -y install libgtk-4-dev libpipewire-0.3-dev

    - name: Install Dependencies
      if: matrix.os == 'windows-latest'
      run: |
        vcpkg install --triplet=x64-windows

        echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV
        echo "PKG_CONFIG_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib\pkgconfig" >> $GITHUB_ENV
        echo "GTK_LIB_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib" >> $GITHUB_ENV
        echo "RUST_VCPKG_DEFAULT_BINARIES=1" >> $GITHUB_ENV
        echo "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" >> $GITHUB_PATH
        echo "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\tools\pkgconf" >> $GITHUB_PATH

    - name: Haha funny debug in prod
      if: matrix.os == 'windows-latest'
      run: |
        dir $env:VCPKG_INSTALLATION_ROOT
        dir $env:VCPKG_INSTALLATION_ROOT\installed
        dir $env:VCPKG_INSTALLATION_ROOT\installed\x64-windows
        dir $env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib
        dir $env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib\pkgconfig
    
    - name: Build
      if: matrix.os == 'windows-latest'
      run: cargo build --verbose

    - name: Build
      if: matrix.os != 'windows-latest'
      run: cargo build --verbose --workspace --exclude ningyo-spout2
    
    - name: Run tests
      if: matrix.os == 'windows-latest'
      run: cargo test --verbose
    
    - name: Run tests
      if: matrix.os != 'windows-latest'
      run: cargo test --verbose --workspace --exclude ningyo-spout2