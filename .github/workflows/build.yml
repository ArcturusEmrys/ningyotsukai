name: Build

on:
  push:
    branches: [ 'main', 'master' ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os: ['windows-latest', 'ubuntu-latest']

    runs-on: ${{matrix.os}}

    steps:
    - uses: actions/checkout@v4
    
    - name: Enable GitHub Actions Cache backend
      if: matrix.os == 'windows-latest'
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Install Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get -y install libgtk-4-dev libpipewire-0.3-dev

    - name: Install Dependencies
      if: matrix.os == 'windows-latest'
      env:
        VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      run: |
        vcpkg install --triplet=x64-windows

        echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
        echo "RUST_VCPKG_DEFAULT_BINARIES=1" >> $env:GITHUB_ENV
        echo "PKG_CONFIG_PATH=${{ github.workspace }}\vcpkg_installed\x64-windows\lib\pkgconfig" >> $env:GITHUB_ENV
        echo "GTK_LIB_DIR=${{ github.workspace }}\vcpkg_installed\x64-windows\lib" >> $env:GITHUB_ENV
        echo "PKG_CONFIG=${{ github.workspace }}\vcpkg_installed\x64-windows\tools\pkgconf\pkgconf.exe" >> $env:GITHUB_ENV
        echo "${{ github.workspace }}\vcpkg_installed\x64-windows\bin" >> $env:GITHUB_PATH
        echo "${{ github.workspace }}\vcpkg_installed\x64-windows\tools\pkgconf" >> $env:GITHUB_PATH

    - name: Haha funny debug in prod
      if: matrix.os == 'windows-latest'
      run: |
        dir $env:VCPKG_INSTALLATION_ROOT
        dir ${{ github.workspace }}\vcpkg_installed
        dir ${{ github.workspace }}\vcpkg_installed\x64-windows
        dir ${{ github.workspace }}\vcpkg_installed\x64-windows\lib
        dir ${{ github.workspace }}\vcpkg_installed\x64-windows\lib\pkgconfig
    
    - name: Build
      if: matrix.os == 'windows-latest'
      run: cargo build --verbose

    - name: Build
      if: matrix.os != 'windows-latest'
      run: cargo build --verbose --workspace --exclude ningyo-spout2
    
    - name: Run tests
      if: matrix.os == 'windows-latest'
      run: cargo test --verbose
    
    - name: Run tests
      if: matrix.os != 'windows-latest'
      run: cargo test --verbose --workspace --exclude ningyo-spout2