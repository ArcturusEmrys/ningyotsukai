name: Build

on:
  push:
    branches: [ 'main', 'master' ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os: ['windows-latest', 'ubuntu-latest']

    runs-on: ${{matrix.os}}

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get -y install libgtk-4-dev libpipewire-0.3-dev

    - name: Install Dependencies
      if: matrix.os == 'windows-latest'
      run: |
        vcpkg install gtk:x64-windows

    - name: Build
      if: matrix.os == 'windows-latest'
      run: cargo build --verbose

    - name: Build
      if: matrix.os != 'windows-latest'
      run: cargo build --verbose --workspace --exclude ningyo-spout2
    
    - name: Run tests
      if: matrix.os == 'windows-latest'
      run: cargo test --verbose
    
    - name: Run tests
      if: matrix.os != 'windows-latest'
      run: cargo test --verbose --workspace --exclude ningyo-spout2